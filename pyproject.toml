[project]
name = "synthetic-qa-agent-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.5.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "torch",
    "torchaudio",
    "torchvision",
    "unsloth>=2025.7.2",
    "unsloth-zoo>=2025.7.4",
]

[tool.uv.sources]
torch = { index = "rocm-nightly" }
torchaudio = { index = "rocm-nightly" }
